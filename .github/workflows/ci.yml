# GitHub Actions CI for OmniAble
# Runs Python tests, frontend unit/build checks and the isolated browser suite
# on every push / PR to main or master.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  browser:
    # Keep the browser system dependencies on the tested Ubuntu release.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install API test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements-windows.txt

      - name: Install frontend and browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser regression
        run: |
          source .venv/bin/activate
          bash frontend/tests/run-browser-ci.sh

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-artifacts
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cache pip downloads + the sentence-transformers (BGE-M3) model cache
      # so reruns don't re-download ~2GB every time.
      - name: Cache pip and HuggingFace model cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: ${{ runner.os }}-py3.12-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-py3.12-

      - name: Create virtual environment and install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # HF_ENDPOINT (project-documented mirror) lets the embedding tests
      # download BGE-M3 from the domestic mirror instead of huggingface.co.
      - name: Run tests
        env:
          HF_ENDPOINT: https://hf-mirror.com
        run: |
          source .venv/bin/activate
          pytest -q

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-py3.12-core-${{ hashFiles('requirements-windows.txt') }}
          restore-keys: |
            ${{ runner.os }}-py3.12-core-

      - name: Create virtual environment and install Windows core dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-windows.txt

      - name: Run hash-backend tests
        env:
          OS_AGENT_MEMORY_BACKEND: memory
          OS_AGENT_EMBEDDING_BACKEND: hash
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: .\.venv\Scripts\python.exe -m pytest -q
